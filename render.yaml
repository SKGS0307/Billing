services:
  - type: web
    name: the-trends-mart-api-skgs0307
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build -w backend
    preDeployCommand: npm run db:migrate -w backend && npm run db:seed -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: the-trends-mart-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVE_FRONTEND
        value: "false"
      - key: ALLOW_DATABASE_RESTORE
        value: "false"
      - key: API_RATE_LIMIT
        value: "1000"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: STORE_TIMEZONE
        value: Asia/Kolkata
      - key: BACKUP_PATH
        value: /tmp/trends-mart-backups
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: the-trends-mart-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: trends_mart
    user: trends_mart
    ipAllowList: []
